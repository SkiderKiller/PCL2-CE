name: CI - Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCL.Core/**'
      - 'PCL.Test/**'
      - 'Plain Craft Launcher 2.slnx'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - master
      - dev
      - develop
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCL.Core/**'
      - 'PCL.Test/**'
      - 'Plain Craft Launcher 2.slnx'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  # 构建和测试作业
  build-and-test:
    name: Build & Test - ${{ matrix.configuration }} (${{ matrix.architecture }})
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
        architecture: [x64, ARM64]
      fail-fast: false

    env:
      LANG: zh-CN
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: 恢复 NuGet 包
        run: dotnet restore "Plain Craft Launcher 2.slnx"

      - name: 构建解决方案
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          dotnet build "Plain Craft Launcher 2.slnx" `
            -c ${{ matrix.configuration }} `
            -p:Platform=${{ matrix.architecture }} `
            --no-restore

      - name: 运行单元测试
        if: matrix.architecture == 'x64'
        run: |
          dotnet test "PCL.Test/PCL.Test.csproj" `
            -c ${{ matrix.configuration }} `
            -p:Platform=${{ matrix.architecture }} `
            --no-build `
            --verbosity normal `
            --logger "trx;LogFileName=test-results.trx"
        continue-on-error: true

      - name: 发布测试结果
        if: matrix.architecture == 'x64' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}-${{ matrix.architecture }}
          path: '**/test-results.trx'
          if-no-files-found: ignore

      - name: 发布应用程序
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.vbproj" `
            -c ${{ matrix.configuration }} `
            -p:Platform=${{ matrix.architecture }} `
            -p:PublishSingleFile=true `
            -p:DeleteExistingFiles=true `
            -o ./publish/${{ matrix.architecture }} `
            --self-contained false `
            --no-build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PCL2-CE-${{ matrix.configuration }}-${{ matrix.architecture }}
          path: ./publish/${{ matrix.architecture }}/**
          retention-days: 30

  # 代码质量检查作业
  code-quality:
    name: Code Quality Check
    runs-on: windows-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: 恢复 NuGet 包
        run: dotnet restore "Plain Craft Launcher 2.slnx"

      - name: 代码格式检查
        run: dotnet format "Plain Craft Launcher 2.slnx" --verify-no-changes --verbosity diagnostic
        continue-on-error: true

  # 构建摘要作业
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: always()
    
    steps:
      - name: 检查构建状态
        run: |
          echo "构建和测试状态: ${{ needs.build-and-test.result }}"
          echo "代码质量检查状态: ${{ needs.code-quality.result }}"
          
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "❌ 构建或测试失败"
            exit 1
          fi
          
          echo "✅ 所有构建任务完成"
