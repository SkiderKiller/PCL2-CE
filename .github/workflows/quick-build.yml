name: Quick Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  quick-build:
    name: Quick Build (x64 Debug)
    runs-on: windows-latest
    
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: 恢复依赖
        run: dotnet restore "Plain Craft Launcher 2.slnx"

      - name: 快速构建
        env:
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          dotnet build "Plain Craft Launcher 2/Plain Craft Launcher 2.vbproj" `
            -c Debug `
            -p:Platform=x64 `
            --no-restore

      - name: 运行测试
        run: |
          dotnet test "PCL.Test/PCL.Test.csproj" `
            -c Debug `
            -p:Platform=x64 `
            --no-build `
            --verbosity minimal
        continue-on-error: true

      - name: 构建结果
        if: always()
        run: |
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ 快速构建成功"
          } else {
            Write-Host "❌ 快速构建失败"
          }
